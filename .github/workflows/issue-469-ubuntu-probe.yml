name: issue-469 ubuntu probe

on:
  push:
    branches:
      - ci/issue-469-ubuntu-probe

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Read /proc exe and run both prune decisions
        env:
          PROBE_TMP_ROOT: /tmp
          PROBE_BASE: ${{ github.workspace }}/.tmp/issue-469-probe
        run: bash .github/probe/issue-469-ubuntu-probe.sh

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install and build the executor dependency tree
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @sciencediscovery/executor... build

      - name: Run remote runner prune tests
        run: node --import tsx --test packages/executor/src/remote-compute-prune.test.ts
